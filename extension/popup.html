<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RepoDAG</title>
    <style>
      :root { color-scheme: light dark; --ink: #18222b; --soft: #51606b; --paper: #fbfcf9; --rule: #c8cfc6; --well: #eef1ea; }
      @media (prefers-color-scheme: dark) { :root { --ink: #e7ecea; --soft: #9dadb5; --paper: #1c242b; --rule: #33414a; --well: #151b20; } }
      body { margin: 0; padding: 14px; width: 300px; background: var(--paper); color: var(--ink);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      h1 { font-size: 15px; font-weight: 650; margin: 0 0 8px; letter-spacing: 0; }
      p { margin: 0 0 10px; color: var(--soft); }
      #repo { display: block; margin: 0 0 10px; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 4px; background: var(--well);
        color: var(--ink); font: 12px/1.4 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; overflow-wrap: anywhere; }
      button { display: block; width: 100%; margin: 0 0 8px; padding: 8px 10px; border: 1px solid var(--ink); border-radius: 4px;
        background: var(--ink); color: var(--paper); font: inherit; font-weight: 600; cursor: pointer; text-align: center; }
      button.quiet { background: transparent; color: var(--ink); font-weight: 500; border-color: var(--rule); }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      [hidden] { display: none !important; }
      #status { margin: 4px 0 0; min-height: 1.45em; color: var(--ink); }
    </style>
  </head>
  <body>
    <h1>RepoDAG</h1>
    <div id="on-repo" hidden>
      <span id="repo"></span>
      <button id="map" type="button">Map this repository</button>
    </div>
    <p id="off-repo" hidden>This tab is not a GitHub repository. Open a repository page on github.com, then click the toolbar icon again.</p>
    <button id="local" type="button" class="quiet">Open a zip or folder from your computer</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="lib/ghurl.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
